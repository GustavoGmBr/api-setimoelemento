# Instalar como /etc/nginx/sites-available/setimoelemento-api
# Habilitar em sites-enabled e executar nginx -t antes de recarregar.
# O Certbot acrescenta HTTPS depois da validacao do DNS e da porta 80.
server {
    listen 80;
    listen [::]:80;
    server_name api-livros.setimoelemento.com.br;

    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:3335;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
